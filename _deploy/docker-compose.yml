services:
  nginx:
    image: nginx:1.27-alpine
    container_name: singbox-webui-nginx
    restart: unless-stopped
    network_mode: host
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro
    # host 网络：nginx 仅监听 127.0.0.1:9909，并访问 127.0.0.1:33334 后端
