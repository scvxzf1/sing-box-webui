worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # nginx 容器内临时目录
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # 前端静态文件 gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # 上游 = 本机 Go 后端（host 网络下 127.0.0.1:31334）
    upstream singbox_backend {
        server 127.0.0.1:31334;
        keepalive 16;
    }

    server {
        listen 127.0.0.1:9909;
        server_name _;

        # 前端静态资源
        root /usr/share/nginx/html;
        index index.html;

        # SPA 回退：非文件请求回 index.html
        location / {
            try_files $uri $uri/ /index.html;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }

        # API + 健康检查转发到 Go 后端
        location /api/ {
            proxy_pass http://singbox_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 后端 Host 仍为回环 API；保留浏览器 Origin/Sec-Fetch-Site 供后端校验。
            proxy_set_header Host 127.0.0.1:31334;
            proxy_set_header Origin $http_origin;

            # 透传客户端 IP（仅记录用，后端不依赖）
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 支持（/api/v1/events）
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        location /healthz {
            proxy_pass http://singbox_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host 127.0.0.1:31334;
            proxy_set_header Origin $http_origin;
        }

        # 静态资源缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
